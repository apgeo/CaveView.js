<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-gb" lang="en-gb" dir="ltr">
<head>
	<title>demo 3d cave viewer</title>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link type="text/css" href="CaveView/css/caveview.css" rel="stylesheet"/>
	<meta name="Description" content="CaveView - 3d Cave model viewer">
</head>
<body onload="onload();" >

<style>

	* {
		box-sizing: border-box;
	}

	#scene {
		position: relative;
		width: 800px;
		height: 600px;

		/* the viewer is never wider or taller than the window it is displayed in. Dynamic
		   viewport units follow the browser chrome that appears and disappears as a page
		   is scrolled on a phone, which static units do not, so the bottom of the model
		   is not left underneath it. The static unit is what a browser that does not know
		   the dynamic one uses. */

		max-width: 100%;
		max-height: 100vh;
		max-height: 100dvh;

		/* the toolbar takes its appearance from these. Its colours are set here and its
		   sizes are not, so it is still sized for whatever is pointing at it. */

		--cv-toolbar-background: rgba( 0, 0, 0, 0.7 );
		--cv-toolbar-border: 1px solid #1ab4e5;
		--cv-toolbar-active-background: #1ab4e5;
	}

	#controls {
		padding: 20px;
	}

</style>

<script type="text/javascript" src="CaveView/js/CaveView2.js" ></script>

<script type="text/javascript" >

function onload () {

	const viewer = new CV2.CaveViewer( "scene", {
		terrainDirectory: "terrain/",
		surveyDirectory: "surveys/",
		home: "CaveView/"
	} );

	// the toolbar works with or without the side panel: this page has both

	const ui = new CV2.CaveViewUI( viewer );

	ui.loadCaveList( [ '<<SURVEY FILENAME>>', '<<SURVEY FILENAME>>' ] );

	// the container of the viewer, so that the toolbar is placed over the model

	const container = document.getElementById( 'scene' );

	let toolbar = new CV2.CaveViewToolbar( viewer, container );

	// a toolbar of a few buttons, in the order they are listed, along the bottom

	document.getElementById( 'short' ).addEventListener( 'click', function () {

		toolbar.dispose();

		toolbar = new CV2.CaveViewToolbar( viewer, container, {
			placement: 'bottom',
			buttons: [ 'viewPlan', 'viewNorth', 'stations', 'stationLabels', 'shadingMode', 'fullscreen' ]
		} );

	} );

	document.getElementById( 'full' ).addEventListener( 'click', function () {

		toolbar.dispose();

		toolbar = new CV2.CaveViewToolbar( viewer, container );

	} );

	// the buttons display the state of the properties they set, wherever it is changed

	document.getElementById( 'stations' ).addEventListener( 'click', function () {

		viewer.stations = ! viewer.stations;

	} );

}

</script>
<h1>Example - toolbar</h1>
<div style="padding: 20px">
	<div id="scene"></div>
</div>

<div id="controls">
	<p>
		<button id="full" >full toolbar, at the top</button>
		<button id="short" >selected buttons, at the bottom</button>
	</p>
	<p>
		<button id="stations" >toggle stations from this page</button>
	</p>
</div>

<div style="clear: both" id="scratch">.</div>
</body>
</html>
