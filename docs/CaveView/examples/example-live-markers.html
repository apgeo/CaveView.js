<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en-gb" lang="en-gb" dir="ltr">
<head>
	<title>demo 3d cave viewer</title>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link type="text/css" href="CaveView/css/caveview.css" rel="stylesheet"/>
	<meta name="Description" content="CaveView - 3d Cave model viewer">
</head>
<body onload="onload();" >

<style>

	* {
		box-sizing: border-box;
	}

	#scene {
		position: relative;
		width: 600px;
		height: 600px;

		/* the viewer is never wider or taller than the window it is displayed in. Dynamic
		   viewport units follow the browser chrome that appears and disappears as a page
		   is scrolled on a phone, which static units do not, so the bottom of the model
		   is not left underneath it. The static unit is what a browser that does not know
		   the dynamic one uses. */

		max-width: 100%;
		max-height: 100vh;
		max-height: 100dvh;
	}

	#controls {
		padding: 20px;
	}

	#hover, #status, #markers {
		font-family: monospace;
		min-height: 1.2em;
	}

</style>

<script type="text/javascript" src="CaveView/js/CaveView2.js" ></script>

<script type="text/javascript" >

function onload () {

	const viewer = new CV2.CaveViewer( "scene", {
		terrainDirectory: "terrain/",
		surveyDirectory: "surveys/",
		home: "CaveView/",
		view: {
			stations: true
		}
	} );

	const ui = new CV2.CaveViewUI( viewer );

	ui.loadCaveList( [ '<<SURVEY FILENAME>>', '<<SURVEY FILENAME>>' ] );

	const stationList = document.getElementById( 'station-list' );
	const markerList = document.getElementById( 'marker-list' );
	const hover = document.getElementById( 'hover' );
	const status = document.getElementById( 'status' );
	const markers = document.getElementById( 'markers' );

	const colors = [ 'yellow', 'cyan', 'magenta' ];

	let count = 0;

	viewer.addEventListener( 'newCave', function () {

		stationList.replaceChildren();

		viewer.forEachStation( function ( station ) {

			addOption( stationList, station.name() );

		} );

		// markers of a model that is loaded again are placed where they were: the set is
		// kept, and resolved against each model as it is loaded

		report();

	} );

	// a marker of its own for each party underground, named by the party rather than by
	// the station it happens to be at

	document.getElementById( 'add' ).addEventListener( 'click', function () {

		const id = 'party-' + ( ++count );

		viewer.addLiveMarker( id, stationList.value, {
			label: id,
			sublabel: 'last reported ' + new Date().toLocaleTimeString(),
			color: colors[ count % colors.length ],
			// anything the page wants back when the marker is pointed at
			payload: { party: count }
		} );

		addOption( markerList, id );

		status.textContent = id + ' added';

		report();

	} );

	// moving a marker slides it from one station to the other, without the model being
	// touched

	document.getElementById( 'move' ).addEventListener( 'click', function () {

		const id = markerList.value;

		if ( id === '' ) return;

		viewer.moveLiveMarker( id, stationList.value, {
			sublabel: 'last reported ' + new Date().toLocaleTimeString()
		} );

		status.textContent = id + ' moved';

		report();

	} );

	document.getElementById( 'remove' ).addEventListener( 'click', function () {

		const id = markerList.value;

		if ( id === '' ) return;

		viewer.removeLiveMarker( id );

		markerList.replaceChildren( ...Array.from( markerList.options ).filter( o => o.value !== id ) );

		status.textContent = id + ' removed';

		report();

	} );

	document.getElementById( 'clear-markers' ).addEventListener( 'click', function () {

		viewer.clearLiveMarkers();

		markerList.replaceChildren();

		status.textContent = 'all markers removed';

		report();

	} );

	viewer.addEventListener( 'liveMarkerHover', function ( event ) {

		hover.textContent = event.id + ' - party ' + event.payload.party;

		// this page displays what it knows about the party itself, so the marker does not
		// need to display its own second line

		event.handled = true;

	} );

	function report () {

		// a marker naming a station of another model is kept, and reported unresolved

		markers.textContent = viewer.getLiveMarkers().map(
			marker => marker.id + ( marker.resolved ? '' : ' (not in this model)' )
		).join( ', ' );

	}

	function addOption ( list, name ) {

		const option = document.createElement( 'option' );

		option.value = name;
		option.textContent = name;

		list.appendChild( option );

	}

}

</script>
<h1>Example - live markers</h1>
<div style="padding: 20px">
	<div id="scene"></div>
</div>

<div id="controls">
	<p>
		<select id="station-list" ></select>
		<button id="add" >add a marker here</button>
	</p>
	<p>
		<select id="marker-list" ></select>
		<button id="move" >move it to the selected station</button>
		<button id="remove" >remove it</button>
		<button id="clear-markers" >remove all</button>
	</p>
	<p>markers: <span id="markers" ></span></p>
	<p>pointed at: <span id="hover" ></span></p>
	<p id="status" ></p>
</div>

<div style="clear: both" id="scratch">.</div>
</body>
</html>
